name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run local unit tests
        run: bash ./gradlew --no-daemon :app:testWhatsappDebugUnitTest :app:testBusinessDebugUnitTest
      - name: Run Android lint
        run: bash ./gradlew --no-daemon :app:lintWhatsappDebug :app:lintBusinessDebug
      - name: Compile unsigned debug APK
        run: bash ./gradlew --no-daemon :app:assembleWhatsappDebug :app:assembleBusinessDebug
